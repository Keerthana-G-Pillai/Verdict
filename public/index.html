<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERDICT — Adversarial AI Code Review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1f2937;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --red: #f85149;
      --green: #3fb950;
      --yellow: #d29922;
      --purple: #bc8cff;
      --orange: #ffa657;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Layout ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
    }
    header .tagline {
      color: var(--muted);
      font-size: 12px;
    }
    header nav {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    header nav button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: color .15s, border-color .15s;
    }
    header nav button:hover, header nav button.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    main { max-width: 860px; margin: 32px auto; padding: 0 20px; }

    .view { display: none; }
    .view.active { display: block; }

    /* ── Forms ── */
    h2 { font-size: 17px; font-weight: 600; margin-bottom: 20px; color: var(--text); }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; margin-top: 14px; text-transform: uppercase; letter-spacing: .5px; }
    label span.req { color: var(--red); margin-left: 2px; }
    input[type="text"], textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      transition: border-color .15s;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea.mono { font-family: "Cascadia Code", "Fira Mono", "Courier New", monospace; font-size: 12px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); }

    .form-actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
    .status-msg { font-size: 12px; color: var(--muted); }
    .status-msg.error { color: var(--red); }

    /* ── Trial list ── */
    .trial-list { display: flex; flex-direction: column; gap: 10px; }
    .trial-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 16px;
      align-items: start;
    }
    .trial-card:hover { border-color: var(--accent); }
    .trial-card .trial-desc { font-weight: 600; font-size: 14px; color: var(--text); }
    .trial-card .trial-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .trial-card .verdict-badge { grid-row: span 2; align-self: center; }

    /* ── Verdict badge ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .badge-APPROVED { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
    .badge-REJECTED { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
    .badge-APPROVED_WITH_CONDITIONS { background: rgba(210,153,34,.15); color: var(--yellow); border: 1px solid rgba(210,153,34,.3); }
    .badge-PENDING, .badge-RUNNING { background: rgba(88,166,255,.12); color: var(--accent); border: 1px solid rgba(88,166,255,.25); }
    .badge-ERROR { background: rgba(255,100,50,.12); color: var(--orange); border: 1px solid rgba(255,100,50,.25); }
    .badge-COMPLETE { background: rgba(63,185,80,.1); color: var(--green); border: 1px solid rgba(63,185,80,.2); }

    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }

    /* ── Trial detail ── */
    .back-btn { margin-bottom: 20px; }
    .detail-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .detail-header h3 { font-size: 16px; margin-bottom: 8px; }
    .detail-meta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .detail-meta span { font-size: 11px; color: var(--muted); }

    .agents-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    @media (max-width: 620px) { .agents-grid { grid-template-columns: 1fr; } }

    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .agent-card.judge { grid-column: span 2; }
    @media (max-width: 620px) { .agent-card.judge { grid-column: span 1; } }

    .agent-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    .agent-header.prosecutor { background: rgba(248,81,73,.08); color: var(--red); }
    .agent-header.defender { background: rgba(63,185,80,.08); color: var(--green); }
    .agent-header.experimenter { background: rgba(188,140,255,.08); color: var(--purple); }
    .agent-header.judge { background: rgba(88,166,255,.08); color: var(--accent); }

    .agent-body { padding: 14px; font-size: 13px; }

    .risk-item, .evidence-item {
      border-left: 3px solid var(--border);
      padding: 8px 12px;
      margin-bottom: 8px;
      background: var(--surface2);
      border-radius: 0 4px 4px 0;
    }
    .risk-item { border-left-color: var(--red); }
    .evidence-item { border-left-color: var(--green); }
    .risk-item .claim, .evidence-item .claim { font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .risk-item .justification, .evidence-item .justification { color: var(--muted); font-size: 12px; }
    .severity-HIGH { color: var(--red); font-size: 10px; font-weight: 700; margin-left: 6px; }
    .severity-MEDIUM { color: var(--yellow); font-size: 10px; font-weight: 700; margin-left: 6px; }
    .severity-LOW { color: var(--green); font-size: 10px; font-weight: 700; margin-left: 6px; }

    .kv-row { display: flex; gap: 10px; margin-bottom: 7px; font-size: 12px; }
    .kv-key { color: var(--muted); min-width: 140px; flex-shrink: 0; }
    .kv-val { color: var(--text); }

    .conditions-list { margin: 6px 0 0 16px; }
    .conditions-list li { margin-bottom: 4px; color: var(--muted); font-size: 12px; }

    .verdict-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .verdict-label { font-size: 11px; color: var(--muted); text-transform: uppercase; }

    pre.diff-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: "Cascadia Code", "Fira Mono", "Courier New", monospace;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      max-height: 160px;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .5px;
      margin-bottom: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚖ VERDICT</div>
    <div class="tagline">Adversarial AI Code Review — Stage 0 Scaffold</div>
  </div>
  <nav>
    <button class="active" onclick="showView('submit')" id="nav-submit">Submit Change</button>
    <button onclick="showView('list')" id="nav-list">Trial History</button>
  </nav>
</header>

<main>

  <!-- ─────────────── SUBMIT VIEW ─────────────── -->
  <div class="view active" id="view-submit">
    <h2>Submit a Code Change for Trial</h2>
    <form id="submitForm" onsubmit="submitTrial(event)">
      <label>Diff / Code Change <span class="req">*</span></label>
      <textarea class="mono" name="diff" rows="10"
        placeholder="Paste your unified diff or raw code change here…"></textarea>

      <label>Description <span class="req">*</span></label>
      <input type="text" name="description"
        placeholder="e.g. Adds user-supplied ID to SQL query in getUser route" />

      <label>File Context <span style="color:var(--muted);font-size:11px;">(optional)</span></label>
      <input type="text" name="file_context"
        placeholder="e.g. src/routes/users.js — Express route handler" />

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">
          Run Trial
        </button>
        <span class="status-msg" id="submitStatus"></span>
      </div>
    </form>
  </div>

  <!-- ─────────────── LIST VIEW ─────────────── -->
  <div class="view" id="view-list">
    <h2>Trial History</h2>
    <div id="trialList" class="trial-list">
      <div class="empty-state">
        <div class="icon">📂</div>
        Loading trials…
      </div>
    </div>
  </div>

  <!-- ─────────────── DETAIL VIEW ─────────────── -->
  <div class="view" id="view-detail">
    <button class="btn btn-ghost back-btn" onclick="showView('list')">← Back to History</button>
    <div id="trialDetail"></div>
  </div>

</main>

<script>
  const API = '/api';

  // ── View routing ─────────────────────────────────────────────────────────
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('header nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    const navBtn = document.getElementById('nav-' + name);
    if (navBtn) navBtn.classList.add('active');
    if (name === 'list') loadTrialList();
  }

  // ── Submit form ───────────────────────────────────────────────────────────
  async function submitTrial(e) {
    e.preventDefault();
    const form = e.target;
    const diff = form.diff.value.trim();
    const description = form.description.value.trim();
    const file_context = form.file_context.value.trim();

    if (!diff)        return setStatus('diff is required.', true);
    if (!description) return setStatus('description is required.', true);

    setStatus('Running trial pipeline…', false, true);
    document.getElementById('submitBtn').disabled = true;

    try {
      const res = await fetch(`${API}/trials`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ diff, description, file_context: file_context || undefined }),
      });
      const trial = await res.json();
      if (!res.ok) throw new Error(trial.error || 'Unknown error');

      setStatus('');
      document.getElementById('submitBtn').disabled = false;
      form.reset();
      renderDetail(trial);
      showView('detail');
    } catch (err) {
      setStatus('Error: ' + err.message, true);
      document.getElementById('submitBtn').disabled = false;
    }
  }

  function setStatus(msg, isError = false, loading = false) {
    const el = document.getElementById('submitStatus');
    el.className = 'status-msg' + (isError ? ' error' : '');
    el.innerHTML = loading ? '<span class="spinner"></span> ' + msg : msg;
  }

  // ── Trial list ────────────────────────────────────────────────────────────
  async function loadTrialList() {
    const container = document.getElementById('trialList');
    container.innerHTML = '<div class="empty-state"><div class="icon">⏳</div>Loading…</div>';
    try {
      const res = await fetch(`${API}/trials`);
      const trials = await res.json();
      if (!trials.length) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📂</div>No trials yet — submit your first change.</div>';
        return;
      }
      container.innerHTML = trials.map(renderTrialCard).join('');
    } catch (err) {
      container.innerHTML = `<div class="empty-state" style="color:var(--red)">Failed to load trials: ${err.message}</div>`;
    }
  }

  function renderTrialCard(trial) {
    const verdict = trial.judge_verdict?.verdict || trial.status;
    const badge = verdictBadge(verdict);
    const ts = new Date(trial.timestamp).toLocaleString();
    const desc = escHtml(trial.submitted_change.description);
    return `
      <div class="trial-card" onclick="loadAndShowDetail('${trial.id}')">
        <div>
          <div class="trial-desc">${desc}</div>
          <div class="trial-meta">ID: ${trial.id.slice(0, 8)}… · ${ts}</div>
        </div>
        <div class="verdict-badge">${badge}</div>
      </div>`;
  }

  function verdictBadge(v) {
    const cls = {
      'APPROVED': 'badge-APPROVED',
      'REJECTED': 'badge-REJECTED',
      'APPROVED_WITH_CONDITIONS': 'badge-APPROVED_WITH_CONDITIONS',
      'PENDING': 'badge-PENDING',
      'RUNNING': 'badge-RUNNING',
      'COMPLETE': 'badge-COMPLETE',
      'ERROR': 'badge-ERROR',
    }[v] || 'badge-PENDING';
    return `<span class="badge ${cls}">${v}</span>`;
  }

  // ── Trial detail ──────────────────────────────────────────────────────────
  async function loadAndShowDetail(id) {
    document.getElementById('trialDetail').innerHTML =
      '<div class="empty-state"><span class="spinner"></span> Loading trial…</div>';
    showView('detail');
    try {
      const res = await fetch(`${API}/trials/${id}`);
      const trial = await res.json();
      renderDetail(trial);
    } catch (err) {
      document.getElementById('trialDetail').innerHTML =
        `<div class="empty-state" style="color:var(--red)">Failed to load trial: ${err.message}</div>`;
    }
  }

  function renderDetail(trial) {
    const sc = trial.submitted_change;
    const p = trial.prosecutor_output;
    const d = trial.defender_output;
    const ex = trial.experimenter_output;
    const j = trial.judge_verdict;
    const verdict = j?.verdict || trial.status;

    const html = `
      <div class="detail-header">
        <h3>${escHtml(sc.description)}</h3>
        <div class="detail-meta">
          <span>ID: ${trial.id}</span>
          <span>${new Date(trial.timestamp).toLocaleString()}</span>
          ${verdictBadge(trial.status)}
          ${sc.file_context ? `<span>📄 ${escHtml(sc.file_context)}</span>` : ''}
        </div>
      </div>

      <div class="section-label">Submitted Diff</div>
      <pre class="diff-block">${escHtml(sc.diff)}</pre>

      <div class="section-label">Agent Outputs</div>
      <div class="agents-grid">

        <!-- Prosecutor -->
        <div class="agent-card">
          <div class="agent-header prosecutor">⚔ Prosecutor</div>
          <div class="agent-body">
            ${p ? p.risks.map(r => `
              <div class="risk-item">
                <div class="claim">${escHtml(r.claim)} <span class="severity-${r.severity}">${r.severity}</span></div>
                <div class="justification">${escHtml(r.justification)}</div>
              </div>`).join('') : '<span style="color:var(--muted)">Pending…</span>'}
          </div>
        </div>

        <!-- Defender -->
        <div class="agent-card">
          <div class="agent-header defender">🛡 Defender</div>
          <div class="agent-body">
            ${d ? d.evidence.map(e => `
              <div class="evidence-item">
                <div class="claim">${escHtml(e.claim)}</div>
                <div class="justification">${escHtml(e.justification)}</div>
              </div>`).join('') : '<span style="color:var(--muted)">Pending…</span>'}
          </div>
        </div>

        <!-- Experimenter -->
        <div class="agent-card">
          <div class="agent-header experimenter">🔬 Experimenter</div>
          <div class="agent-body">
            ${ex ? `
              <div class="kv-row"><span class="kv-key">Executed</span><span class="kv-val">${ex.executed}</span></div>
              <div class="kv-row"><span class="kv-key">Result</span><span class="kv-val">${escHtml(ex.result)}</span></div>
              <div class="kv-row"><span class="kv-key">Details</span><span class="kv-val">${escHtml(ex.details)}</span></div>
              ${ex.unexpected_findings ? `<div class="kv-row"><span class="kv-key">Unexpected Findings</span><span class="kv-val" style="color:var(--yellow)">${escHtml(ex.unexpected_findings)}</span></div>` : ''}
            ` : '<span style="color:var(--muted)">Pending…</span>'}
          </div>
        </div>

        <!-- Judge -->
        <div class="agent-card judge">
          <div class="agent-header judge">⚖ Judge</div>
          <div class="agent-body">
            ${j ? `
              <div class="verdict-row">
                <span class="verdict-label">Verdict</span>
                ${verdictBadge(j.verdict)}
              </div>
              <div class="kv-row"><span class="kv-key">Reasoning</span><span class="kv-val">${escHtml(j.reasoning)}</span></div>
              ${j.conditions?.length ? `
                <div class="kv-row">
                  <span class="kv-key">Conditions</span>
                  <span class="kv-val">
                    <ul class="conditions-list">
                      ${j.conditions.map(c => `<li>${escHtml(c)}</li>`).join('')}
                    </ul>
                  </span>
                </div>` : ''}
              ${j.safer_alternative ? `<div class="kv-row"><span class="kv-key">Safer Alternative</span><span class="kv-val" style="color:var(--purple)">${escHtml(j.safer_alternative)}</span></div>` : ''}
            ` : '<span style="color:var(--muted)">Pending…</span>'}
          </div>
        </div>

      </div>`;

    document.getElementById('trialDetail').innerHTML = html;
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
